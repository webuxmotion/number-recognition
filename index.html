<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Recognition — Algorithm Walkthrough</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d1a;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 24px 60px;
      gap: 28px;
    }

    header { text-align: center; }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: #42426a; font-size: 0.95rem; margin-top: 5px; }

    .app {
      display: flex;
      gap: 26px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 1240px;
    }

    .panel {
      background: #12122a;
      border: 1px solid #1e1e3a;
      border-radius: 18px;
      padding: 22px;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #38385a;
      margin-bottom: 14px;
    }

    /* ── Draw section ── */
    .draw-panel {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #draw-canvas {
      background: #000;
      border-radius: 10px;
      cursor: crosshair;
      touch-action: none;
      display: block;
      width: 280px;
      height: 280px;
    }

    .btn-row { display: flex; gap: 10px; width: 100%; }

    .btn {
      padding: 11px 0;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: default; transform: none !important; }

    .btn-clear {
      flex: 0 0 80px;
      background: #1a1a30;
      color: #60607a;
      border: 1px solid #262640;
    }
    .btn-clear:hover:not(:disabled) { background: #1e1e38; }

    .btn-run {
      flex: 1;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      color: #fff;
    }
    .btn-run:hover:not(:disabled) { opacity: 0.88; }

    .hint { font-size: 0.78rem; color: #2a2a48; }

    /* ── Step viewer ── */
    #step-viewer {
      flex: 1;
      min-width: 300px;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .step-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .step-dots { display: flex; gap: 6px; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #1e1e38;
      border: 1px solid #2a2a46;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .dot.done  { background: #3a3a5c; border-color: transparent; }
    .dot.active { background: linear-gradient(135deg,#818cf8,#c084fc); border-color: transparent; }

    .step-counter { font-size: 0.82rem; color: #44446a; }

    .step-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .step-badge {
      width: 34px; height: 34px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg,#818cf8,#c084fc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .step-title { font-size: 1.15rem; font-weight: 700; line-height: 1.2; }
    .step-desc  { font-size: 0.9rem; color: #6868a0; margin-top: 5px; line-height: 1.65; }

    /* ── Viz area ── */
    .step-viz {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 1;
      transition: opacity 0.12s;
    }
    .step-viz.fading { opacity: 0; }

    .viz-caption {
      font-size: 0.8rem;
      color: #44446a;
      text-align: center;
    }
    .viz-stat {
      font-size: 0.88rem;
      color: #818cf8;
      text-align: center;
    }
    .viz-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .viz-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* ── Step nav ── */
    .step-nav {
      display: flex;
      gap: 8px;
    }

    .btn-nav {
      flex: 1;
      background: #1a1a30;
      color: #818cf8;
      border: 1px solid #252550;
      font-size: 0.92rem;
    }
    .btn-nav:hover:not(:disabled) { background: #1e1e38; }

    .btn-play {
      flex: 0 0 78px;
      background: linear-gradient(135deg, #818cf8, #c084fc);
      color: #fff;
      font-size: 0.92rem;
    }
    .btn-play:hover { opacity: 0.88; }

    /* ── Final result inside step-viz ── */
    .result-row {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
    }
    .result-big-digit {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg,#818cf8,#c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      flex-shrink: 0;
      width: 90px;
      text-align: center;
    }
    .conf-bars { flex: 1; }
    .cbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .cbar-lbl { width: 14px; font-size: 0.8rem; color: #4a4a6a; }
    .cbar-track { flex: 1; height: 13px; background: #0d0d1a; border-radius: 3px; overflow: hidden; }
    .cbar-fill  { height: 100%; border-radius: 3px; background: #22223a; transition: width 0.3s; }
    .cbar-fill.top { background: linear-gradient(90deg,#818cf8,#c084fc); }
    .cbar-pct   { width: 38px; font-size: 0.75rem; color: #44446a; text-align: right; }

    /* ── Match grid ── */
    .match-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 10px;
      width: 100%;
    }
    .match-cell {
      background: #0d0d1a;
      border: 1px solid #1e1e3a;
      border-radius: 10px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .match-cell.rank1 { border-color: #818cf8; background: #13132a; }
    .match-cell canvas { image-rendering: pixelated; border-radius: 4px; }
    .match-rank  { font-size: 0.72rem; color: #44446a; }
    .match-digit { font-size: 1.1rem; font-weight: 800; color: #e2e2f0; }
    .match-dist  { font-size: 0.72rem; color: #44446a; }

    @media (max-width: 680px) {
      #step-viewer { max-width: 100%; }
    }

    /* ── Language toggle ── */
    .lang-toggle { display: flex; gap: 6px; margin-top: 10px; justify-content: center; }
    .lang-btn {
      padding: 5px 16px;
      border: 1px solid #252550;
      border-radius: 8px;
      background: #0d0d1a;
      color: #44446a;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lang-btn:hover { color: #818cf8; }
    .lang-btn.lang-active {
      background: linear-gradient(135deg, #818cf8, #c084fc);
      color: #fff;
      border-color: transparent;
    }

    /* ── Expandable sections ── */
    details.x-section {
      width: 100%;
      border: 1px solid #1a1a36;
      border-radius: 10px;
      overflow: hidden;
    }
    details.x-section summary {
      padding: 10px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #48488a;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0b0b1e;
    }
    details.x-section summary::-webkit-details-marker { display: none; }
    details.x-section summary::before {
      content: '▶';
      font-size: 0.58rem;
      transition: transform 0.18s;
      flex-shrink: 0;
      color: #36367a;
    }
    details.x-section[open] summary::before { transform: rotate(90deg); }
    details.x-section summary:hover { color: #818cf8; }
    details.x-section summary:hover::before { color: #818cf8; }
    details.x-section > .x-body {
      border-top: 1px solid #1a1a36;
      background: #06061a;
    }

    /* ── Code block ── */
    .code-pre {
      font-family: "Courier New", monospace;
      font-size: 0.74rem;
      line-height: 1.75;
      color: #7070b8;
      background: #05050f;
      padding: 14px 18px;
      overflow-x: auto;
      white-space: pre;
      tab-size: 2;
      margin: 0;
    }
    .ck { color: #c084fc; font-weight: 600; }   /* keyword */
    .cf { color: #818cf8; }                       /* function name */
    .cn { color: #6ee7b7; }                       /* number */
    .cc { color: #2a2a52; font-style: italic; }  /* comment */
    .cs { color: #fcd34d; }                       /* string */
  </style>
</head>
<body>

<header>
  <h1 id="page-title">Number Recognition</h1>
  <p class="subtitle" id="page-subtitle">Draw a digit · step through the algorithm · see exactly how it works</p>
  <div class="lang-toggle">
    <button class="lang-btn lang-active" id="lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="lang-uk" onclick="setLang('uk')">UK</button>
  </div>
</header>

<div class="app">

  <div class="panel draw-panel">
    <div class="panel-title" id="draw-panel-title">Draw Number Here</div>
    <canvas id="draw-canvas" width="280" height="280"></canvas>
    <div class="btn-row">
      <button class="btn btn-clear" id="clear-btn">Clear</button>
      <button class="btn btn-run"   id="run-btn">▶ Run Steps</button>
    </div>
    <p class="hint" id="hint-text">Draw clearly, centred · thick strokes work best</p>
  </div>

  <div class="panel" id="step-viewer" style="display:none">
    <div class="step-nav">
      <button class="btn btn-nav"  id="prev-btn">← Prev</button>
      <button class="btn btn-play" id="play-btn">▶</button>
      <button class="btn btn-nav"  id="next-btn">Next →</button>
    </div>
    <div class="step-meta">
      <div class="step-dots" id="step-dots"></div>
      <span class="step-counter" id="step-counter"></span>
    </div>
    <div class="step-header">
      <div class="step-badge" id="step-badge">1</div>
      <div>
        <div class="step-title" id="step-title"></div>
        <div class="step-desc"  id="step-desc"></div>
      </div>
    </div>
    <div class="step-viz" id="step-viz"></div>
  </div>

</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 1. PREPROCESSING
// ═══════════════════════════════════════════════════════════════════

function toGrayscale(imageData) {
  const { data, width, height } = imageData;
  const gray = new Float32Array(width * height);
  for (let i = 0; i < gray.length; i++)
    gray[i] = 0.299 * data[i*4] + 0.587 * data[i*4+1] + 0.114 * data[i*4+2];
  return gray;
}

function computeHistogram(gray) {
  const hist = new Float32Array(256);
  for (const v of gray) hist[Math.min(255, Math.round(v))]++;
  return hist;
}

function otsuFromHistogram(hist, total) {
  let sumAll = 0;
  for (let i = 0; i < 256; i++) sumAll += i * hist[i];
  let wB = 0, sumB = 0, maxVar = 0, threshold = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];
    if (!wB) continue;
    const wF = total - wB;
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sumAll - sumB) / wF;
    const v = wB * wF * (mB - mF) ** 2;
    if (v > maxVar) { maxVar = v; threshold = t; }
  }
  return threshold;
}

function binarizeOnly(gray, threshold) {
  const bin = new Uint8Array(gray.length);
  for (let i = 0; i < gray.length; i++) bin[i] = gray[i] > threshold ? 1 : 0;
  return bin;
}

function applyInvertIfNeeded(bin) {
  let ink = 0;
  for (let i = 0; i < bin.length; i++) ink += bin[i];
  const ratio = ink / bin.length;
  const inverted = ratio > 0.5;
  if (inverted) for (let i = 0; i < bin.length; i++) bin[i] ^= 1;
  return { inverted, inkRatio: inverted ? 1 - ratio : ratio };
}

function boundingBox(bin, w, h) {
  let x0 = w, x1 = 0, y0 = h, y1 = 0;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      if (bin[y*w+x]) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
  return x0 > x1 ? null : { x0, x1, y0, y1 };
}

function cropWithPad(bin, w, h, bb, pad = 0.18) {
  const cw = bb.x1 - bb.x0 + 1, ch = bb.y1 - bb.y0 + 1;
  const px = Math.round(Math.max(cw, ch) * pad);
  const ow = cw + 2*px, oh = ch + 2*px;
  const out = new Float32Array(ow * oh);
  for (let y = 0; y < ch; y++)
    for (let x = 0; x < cw; x++)
      out[(y+px)*ow + (x+px)] = bin[(bb.y0+y)*w + (bb.x0+x)];
  return { data: out, w: ow, h: oh };
}

function bilinearResize(src, sw, sh, tw, th) {
  const out = new Float32Array(tw * th);
  for (let dy = 0; dy < th; dy++)
    for (let dx = 0; dx < tw; dx++) {
      const sx = (dx+0.5)*sw/tw - 0.5, sy = (dy+0.5)*sh/th - 0.5;
      const x0 = Math.max(0,Math.floor(sx)), x1 = Math.min(sw-1, x0+1);
      const y0 = Math.max(0,Math.floor(sy)), y1 = Math.min(sh-1, y0+1);
      const fx = sx-x0, fy = sy-y0;
      out[dy*tw+dx] = src[y0*sw+x0]*(1-fx)*(1-fy) + src[y0*sw+x1]*fx*(1-fy)
                    + src[y1*sw+x0]*(1-fx)*fy      + src[y1*sw+x1]*fx*fy;
    }
  return out;
}

// ═══════════════════════════════════════════════════════════════════
// 2. FEATURES
// ═══════════════════════════════════════════════════════════════════

const SZ = 32;

function extractFeatures(px) {
  const rowP = new Float32Array(SZ), colP = new Float32Array(SZ);
  for (let y = 0; y < SZ; y++)
    for (let x = 0; x < SZ; x++) { rowP[y] += px[y*SZ+x]; colP[x] += px[y*SZ+x]; }
  for (let i = 0; i < SZ; i++) { rowP[i] /= SZ; colP[i] /= SZ; }
  const f = new Float32Array(SZ*SZ + SZ + SZ);
  f.set(px, 0); f.set(rowP, SZ*SZ); f.set(colP, SZ*SZ+SZ);
  return f;
}

function euclidean(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i]-b[i]; s += d*d; }
  return Math.sqrt(s);
}

// ═══════════════════════════════════════════════════════════════════
// 3. TEMPLATES
// ═══════════════════════════════════════════════════════════════════

const FONTS = ['Arial','Georgia','Courier New','Times New Roman','Verdana','Impact'];

function makeTemplate(digit, font, bold) {
  const size = 160;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle = '#000';
  ctx.font = `${bold?'bold ':''}${size*0.75}px ${font}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(digit), size/2, size/2);
  const imgData = ctx.getImageData(0,0,size,size);
  const gray = toGrayscale(imgData);
  const hist = computeHistogram(gray);
  const thr  = otsuFromHistogram(hist, size*size);
  const bin  = binarizeOnly(gray, thr);
  applyInvertIfNeeded(bin);
  const bb = boundingBox(bin, size, size);
  if (!bb) return null;
  const cropped = cropWithPad(bin, size, size, bb);
  const pixels  = bilinearResize(cropped.data, cropped.w, cropped.h, SZ, SZ);
  return { feat: extractFeatures(pixels), pixels };
}

function buildTemplates() {
  const out = [];
  for (let d = 0; d <= 9; d++)
    for (const font of FONTS)
      for (const bold of [true, false]) {
        const t = makeTemplate(d, font, bold);
        if (t) out.push({ digit: d, font, bold, feat: t.feat, pixels: t.pixels });
      }
  return out;
}

// ═══════════════════════════════════════════════════════════════════
// 4. CLASSIFICATION
// ═══════════════════════════════════════════════════════════════════

function classifyDetailed(px32) {
  const f = extractFeatures(px32);
  const minDist = new Float32Array(10).fill(Infinity);
  const bestTmpl = new Array(10).fill(null);
  for (const t of templates) {
    const d = euclidean(f, t.feat);
    if (d < minDist[t.digit]) { minDist[t.digit] = d; bestTmpl[t.digit] = t; }
  }
  const eps = 1e-6;
  const raw = Array.from(minDist).map(d => 1/(d+eps));
  const tot = raw.reduce((a,b)=>a+b, 0);
  const conf = raw.map(c => c/tot);
  const best = conf.indexOf(Math.max(...conf));

  // sorted matches for visualization
  const allDist = templates.map(t => ({
    ...t, dist: euclidean(f, t.feat)
  })).sort((a,b) => a.dist - b.dist);

  return { digit: best, conf, minDist, bestTmpl, allDist };
}

// ═══════════════════════════════════════════════════════════════════
// 5. COMPUTE ALL STEP DATA IN ONE PASS
// ═══════════════════════════════════════════════════════════════════

function computeSteps(imageData) {
  const w = imageData.width, h = imageData.height;
  const gray      = toGrayscale(imageData);
  const histogram = computeHistogram(gray);
  const threshold = otsuFromHistogram(histogram, w*h);
  const binary    = binarizeOnly(gray, threshold);
  const invertInfo = applyInvertIfNeeded(binary);
  const bb        = boundingBox(binary, w, h);
  if (!bb) return null;
  const cropped   = cropWithPad(binary, w, h, bb);
  const resized   = bilinearResize(cropped.data, cropped.w, cropped.h, SZ, SZ);
  const features  = extractFeatures(resized);
  const result    = classifyDetailed(resized);

  // row / col projections from features
  const rowProj = Array.from(features.slice(SZ*SZ, SZ*SZ+SZ));
  const colProj = Array.from(features.slice(SZ*SZ+SZ));

  return {
    originalImgData: imageData,
    gray, w, h,
    histogram, threshold,
    binary, invertInfo,
    bb,
    cropped,
    resized,
    rowProj, colProj,
    result
  };
}

// ═══════════════════════════════════════════════════════════════════
// 6. CANVAS HELPERS
// ═══════════════════════════════════════════════════════════════════

function grayCanvas(vals, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < w*h; i++) {
    const v = Math.min(255, Math.round(vals[i]));
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function binCanvas(bin, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < w*h; i++) {
    const v = bin[i]*255;
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function normCanvas(norm, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let i = 0; i < w*h; i++) {
    const v = Math.round(norm[i]*255);
    img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// Returns a canvas scaled via CSS (keeps internal resolution)
function scaledCanvas(canvas, cssW, cssH, pixelated) {
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  if (pixelated) canvas.style.imageRendering = 'pixelated';
  canvas.style.borderRadius = '6px';
  return canvas;
}

function label(text) {
  const el = document.createElement('div');
  el.className = 'viz-caption';
  el.textContent = text;
  return el;
}

function stat(text) {
  const el = document.createElement('div');
  el.className = 'viz-stat';
  el.textContent = text;
  return el;
}

// ═══════════════════════════════════════════════════════════════════
// 7A. EXPANDABLE HELPERS
// ═══════════════════════════════════════════════════════════════════

function makeExpandable(title, bodyEl, openByDefault) {
  const det = document.createElement('details');
  det.className = 'x-section';
  if (openByDefault) det.open = true;
  const sum = document.createElement('summary');
  sum.textContent = title;
  const body = document.createElement('div');
  body.className = 'x-body';
  body.appendChild(bodyEl);
  det.appendChild(sum);
  det.appendChild(body);
  return det;
}

function hlCode(raw) {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const KWS = new Set(['function','const','let','var','for','if','else','return','new','of',
    'break','continue','Math','null','true','false','Infinity','Array','Float32Array','Uint8Array']);
  let out = '', i = 0, n = raw.length;
  while (i < n) {
    const c = raw[i];
    if (c === '/' && raw[i+1] === '/') {               // line comment
      const end = raw.indexOf('\n', i);
      const s = end < 0 ? raw.slice(i) : raw.slice(i, end);
      out += `<span class="cc">${esc(s)}</span>`; i += s.length;
    } else if (c === '"' || c === "'" || c === '`') {  // string literal
      let j = i + 1;
      while (j < n && raw[j] !== c) { if (raw[j] === '\\') j++; j++; }
      if (j < n) j++;
      out += `<span class="cs">${esc(raw.slice(i, j))}</span>`; i = j;
    } else if (/[A-Za-z_$]/.test(c)) {                // identifier / keyword
      let j = i; while (j < n && /\w/.test(raw[j])) j++;
      const word = raw.slice(i, j);
      let k = j; while (k < n && raw[k] === ' ') k++;
      if (KWS.has(word))       out += `<span class="ck">${esc(word)}</span>`;
      else if (raw[k] === '(') out += `<span class="cf">${esc(word)}</span>`;
      else                     out += esc(word);
      i = j;
    } else if (/\d/.test(c) || (c === '.' && /\d/.test(raw[i+1]||''))) { // number
      const m = raw.slice(i).match(/^\d*\.?\d+(?:[eE][+-]?\d+)?/);
      if (m) { out += `<span class="cn">${esc(m[0])}</span>`; i += m[0].length; }
      else   { out += esc(c); i++; }
    } else {
      out += esc(c); i++;
    }
  }
  return out;
}

function codeExpand(title, src) {
  const pre = document.createElement('pre');
  pre.className = 'code-pre';
  pre.innerHTML = hlCode(src.replace(/^\n/, '').replace(/\n\s{0}$/, ''));
  return makeExpandable(title, pre, false);
}

function buildDataExpand(data, stepIdx) {
  const { w, h, gray, histogram, threshold, binary, invertInfo, bb, cropped, resized, rowProj, colProj, result } = data;
  const pd = data.originalImgData.data;
  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-direction:column;gap:6px;width:100%';

  // Lazily-rendered expandable pre block: textFn() is only called on first open
  const addPre = (title, textFn, open) => {
    const pre = document.createElement('pre');
    pre.className = 'code-pre';
    pre.style.maxHeight = '720px';
    pre.style.overflowY = 'auto';
    const det = makeExpandable(title, pre, !!open);
    const fill = () => { if (!pre.textContent) pre.textContent = textFn(); };
    if (open) fill();
    else det.addEventListener('toggle', fill, { once: true });
    container.appendChild(det);
  };

  // ── RGBA ─────────────────────────────────────────────────────
  addPre(`📷 RGBA — ${w}×${h} = ${(w*h).toLocaleString()} pixels`, () => {
    const lines = [
      `// imageData.data — Uint8ClampedArray(${(w*h*4).toLocaleString()})`,
      `// each pixel: [R, G, B, A]  values 0–255  (A=255 always here)`,
      ''
    ];
    for (let y = 0; y < h; y++) {
      const parts = [`row ${String(y).padStart(3)}:`];
      for (let x = 0; x < w; x++) {
        const i = (y*w+x)*4;
        parts.push(`[${String(pd[i]).padStart(3)},${String(pd[i+1]).padStart(3)},${String(pd[i+2]).padStart(3)},${String(pd[i+3]).padStart(3)}]`);
      }
      lines.push(parts.join(' '));
    }
    return lines.join('\n');
  }, stepIdx === 0);

  // ── Grayscale ─────────────────────────────────────────────────
  if (stepIdx >= 1) {
    addPre(`🔘 Grayscale — ${gray.length.toLocaleString()} values`, () => {
      const lines = [
        `// gray[] — Float32Array(${gray.length})`,
        `// formula: 0.299·R + 0.587·G + 0.114·B  →  range 0.0–255.0`,
        ''
      ];
      for (let y = 0; y < h; y++) {
        const parts = [`row ${String(y).padStart(3)}:`];
        for (let x = 0; x < w; x++) parts.push(gray[y*w+x].toFixed(1).padStart(5));
        lines.push(parts.join(' '));
      }
      return lines.join('\n');
    }, stepIdx === 1);
  }

  // ── Histogram ─────────────────────────────────────────────────
  if (stepIdx >= 2) {
    const maxH = Math.max(...Array.from(histogram));
    addPre(`📊 Histogram — 256 bins  ·  threshold = ${threshold}`, () => {
      const lines = [
        `// histogram[] — Float32Array(256)`,
        `// histogram[i] = number of pixels with brightness level i`,
        `// Otsu threshold = ${threshold}`,
        ''
      ];
      for (let i = 0; i < 256; i++) {
        const cnt = Math.round(histogram[i]);
        const bar = '█'.repeat(Math.round(cnt / maxH * 28));
        lines.push(`hist[${String(i).padStart(3)}]  ${String(cnt).padStart(8)} px  ${bar}${i === threshold ? '  ← THRESHOLD' : ''}`);
      }
      return lines.join('\n');
    }, stepIdx === 2);
  }

  // ── Binary ────────────────────────────────────────────────────
  if (stepIdx >= 3) {
    let ink3 = 0;
    for (let i = 0; i < binary.length; i++) ink3 += binary[i];
    addPre(`⬛ Binary — ${binary.length.toLocaleString()} values  ·  ${ink3.toLocaleString()} ink  ·  inverted=${invertInfo.inverted}`, () => {
      const lines = [
        `// binary[] — Uint8Array(${binary.length})  (0 = background, 1 = ink)`,
        `// auto-inverted: ${invertInfo.inverted}   ink ratio before invert: ${(invertInfo.inverted ? 1 - invertInfo.inkRatio : invertInfo.inkRatio).toFixed(6)}`,
        ''
      ];
      for (let y = 0; y < h; y++) {
        const parts = [`row ${String(y).padStart(3)}:`];
        for (let x = 0; x < w; x++) parts.push(binary[y*w+x] ? '1' : '0');
        lines.push(parts.join(' '));
      }
      return lines.join('\n');
    }, stepIdx === 3);
  }

  // ── Bounding box ──────────────────────────────────────────────
  if (stepIdx >= 4 && bb) {
    const bw = bb.x1-bb.x0+1, bh2 = bb.y1-bb.y0+1;
    const pad = Math.round(Math.max(bw,bh2)*0.18);
    addPre(`📐 Bounding Box`, () => [
      `// tightest rectangle enclosing all ink pixels, plus 18% padding`,
      ``,
      `x0  (left)      = ${bb.x0} px`,
      `x1  (right)     = ${bb.x1} px`,
      `y0  (top)       = ${bb.y0} px`,
      `y1  (bottom)    = ${bb.y1} px`,
      ``,
      `content width   = ${bw} px`,
      `content height  = ${bh2} px`,
      ``,
      `padding (18%)   = ${pad} px each side`,
      `padded width    = ${bw+2*pad} px`,
      `padded height   = ${bh2+2*pad} px`,
    ].join('\n'), stepIdx === 4);
  }

  // ── Resized 32×32 ─────────────────────────────────────────────
  if (stepIdx >= 5) {
    addPre(`🔲 Resized 32×32 — 1024 values`, () => {
      const lines = [
        `// resized[] — Float32Array(1024)  values 0.000–1.000`,
        `// source: ${cropped.w}×${cropped.h} px  →  scale x÷${(cropped.w/SZ).toFixed(4)}  y÷${(cropped.h/SZ).toFixed(4)}`,
        `// bilinear interpolation`,
        ''
      ];
      for (let r = 0; r < SZ; r++) {
        const parts = [`row ${String(r).padStart(2)}:`];
        for (let c = 0; c < SZ; c++) parts.push(resized[r*SZ+c].toFixed(3));
        lines.push(parts.join(' '));
      }
      return lines.join('\n');
    }, stepIdx === 5);
  }

  // ── Row projections ───────────────────────────────────────────
  if (stepIdx >= 6) {
    addPre(`📈 Row Projections — 32 values`, () => {
      const lines = [
        `// rowProj[] — Float32Array(32)`,
        `// rowProj[i] = mean ink density across row i  (0.0 = empty, 1.0 = full)`,
        ''
      ];
      rowProj.forEach((v, i) => {
        lines.push(`rowProj[${String(i).padStart(2)}]  ${v.toFixed(8)}  ${'█'.repeat(Math.round(v*40)) || '·'}`);
      });
      return lines.join('\n');
    }, stepIdx === 6);

    addPre(`📊 Col Projections — 32 values`, () => {
      const lines = [
        `// colProj[] — Float32Array(32)`,
        `// colProj[i] = mean ink density across column i`,
        ''
      ];
      colProj.forEach((v, i) => {
        lines.push(`colProj[${String(i).padStart(2)}]  ${v.toFixed(8)}  ${'█'.repeat(Math.round(v*40)) || '·'}`);
      });
      return lines.join('\n');
    }, false);

    addPre(`🧮 Feature Vector — 1088 values`, () => {
      const feat = extractFeatures(resized);
      const lines = [
        `// features[] — Float32Array(1088)`,
        `// indices 0–1023    pixel grid (32×32)`,
        `// indices 1024–1055 row projections (32)`,
        `// indices 1056–1087 col projections (32)`,
        ''
      ];
      for (let i = 0; i < feat.length; i++) {
        const sec = i < 1024 ? 'pixel ' : i < 1056 ? 'rowP  ' : 'colP  ';
        lines.push(`features[${String(i).padStart(4)}]  ${feat[i].toFixed(8)}  // ${sec}`);
      }
      return lines.join('\n');
    }, false);
  }

  // ── Classification ────────────────────────────────────────────
  if (stepIdx >= 7) {
    addPre(`🏆 Distances & Confidence — 10 digits`, () => {
      const lines = [
        `// one distance per digit = best (minimum) across all font variants`,
        `// confidence = 1/(dist+ε) normalised to sum to 100%`,
        `// winner: digit ${result.digit}   confidence: ${(result.conf[result.digit]*100).toFixed(6)}%`,
        ''
      ];
      for (let i = 0; i <= 9; i++) {
        const dist = result.minDist[i] === Infinity ? '         Infinity' : result.minDist[i].toFixed(8).padStart(17);
        const pct = (result.conf[i]*100).toFixed(6);
        lines.push(`digit ${i}  dist =${dist}   conf = ${pct}%${i === result.digit ? '  ← WINNER' : ''}`);
      }
      return lines.join('\n');
    }, true);

    addPre(`📋 All Template Matches — ${result.allDist.length} templates`, () => {
      const lines = [
        `// every template sorted by Euclidean distance to your drawing`,
        `// total = 10 digits × 6 fonts × 2 weights = ${result.allDist.length} templates`,
        ''
      ];
      result.allDist.forEach((t, i) => {
        lines.push(`#${String(i+1).padStart(3)}  digit=${t.digit}  dist=${t.dist.toFixed(8)}  bold=${String(t.bold).padStart(5)}  font="${t.font}"`);
      });
      return lines.join('\n');
    }, false);
  }

  return container;
}

// ─── Source code per step ────────────────────────────────────────────
const STEP_CODE = [
// 0 — RGBA capture
`// Read the drawing canvas into a flat pixel array
const ctx = drawCanvas.getContext('2d');
const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
// imageData.data = Uint8ClampedArray [ R,G,B,A, R,G,B,A, … ]
// pixel at (x, y): index = (y * width + x) * 4

// Example: pixel at (cx, cy)
const idx = (cy * width + cx) * 4;
const r = imageData.data[idx];     // 0–255
const g = imageData.data[idx + 1];
const b = imageData.data[idx + 2];
const a = imageData.data[idx + 3]; // opacity`,

// 1 — Grayscale
`function toGrayscale(imageData) {
  const { data, width, height } = imageData;
  const gray = new Float32Array(width * height);
  for (let i = 0; i < gray.length; i++)
    // ITU-R BT.601 luminance weights
    gray[i] = 0.299 * data[i*4]     // Red   — least green-sensitive
            + 0.587 * data[i*4 + 1] // Green — most sensitive
            + 0.114 * data[i*4 + 2];// Blue  — least sensitive
  return gray; // Float32Array, values 0–255
}`,

// 2 — Otsu
`function computeHistogram(gray) {
  const hist = new Float32Array(256);
  for (const v of gray) hist[Math.min(255, Math.round(v))]++;
  return hist; // hist[i] = count of pixels with brightness i
}

function otsuFromHistogram(hist, total) {
  let sumAll = 0;
  for (let i = 0; i < 256; i++) sumAll += i * hist[i];

  let wB = 0, sumB = 0, maxVar = 0, threshold = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t];                         // weight of background group
    if (!wB) continue;
    const wF = total - wB;                 // weight of foreground group
    if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB;                  // mean brightness of background
    const mF = (sumAll - sumB) / wF;       // mean brightness of foreground
    const v = wB * wF * (mB - mF) ** 2;   // between-class variance
    if (v > maxVar) { maxVar = v; threshold = t; }
  }
  return threshold; // optimal split point
}`,

// 3 — Binarize
`function binarizeOnly(gray, threshold) {
  const bin = new Uint8Array(gray.length);
  for (let i = 0; i < gray.length; i++)
    bin[i] = gray[i] > threshold ? 1 : 0; // 1 = ink, 0 = background
  return bin;
}

function applyInvertIfNeeded(bin) {
  let ink = 0;
  for (let i = 0; i < bin.length; i++) ink += bin[i];
  const ratio = ink / bin.length;
  const inverted = ratio > 0.5; // more than half = image is inverted
  if (inverted)
    for (let i = 0; i < bin.length; i++) bin[i] ^= 1; // flip all bits
  return { inverted, inkRatio: inverted ? 1 - ratio : ratio };
}`,

// 4 — Bounding box
`function boundingBox(bin, w, h) {
  let x0 = w, x1 = 0, y0 = h, y1 = 0;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      if (bin[y * w + x]) {
        if (x < x0) x0 = x;  if (x > x1) x1 = x;
        if (y < y0) y0 = y;  if (y > y1) y1 = y;
      }
  return x0 > x1 ? null : { x0, x1, y0, y1 };
}

function cropWithPad(bin, w, h, bb, pad = 0.18) {
  const cw = bb.x1 - bb.x0 + 1, ch = bb.y1 - bb.y0 + 1;
  const px = Math.round(Math.max(cw, ch) * pad); // 18% of larger dim
  const ow = cw + 2*px, oh = ch + 2*px;
  const out = new Float32Array(ow * oh);
  for (let y = 0; y < ch; y++)
    for (let x = 0; x < cw; x++)
      out[(y + px)*ow + (x + px)] = bin[(bb.y0 + y)*w + (bb.x0 + x)];
  return { data: out, w: ow, h: oh };
}`,

// 5 — Resize
`function bilinearResize(src, sw, sh, tw, th) {
  const out = new Float32Array(tw * th);
  for (let dy = 0; dy < th; dy++)
    for (let dx = 0; dx < tw; dx++) {
      // map output pixel centre back to source coordinates
      const sx = (dx + 0.5) * sw / tw - 0.5;
      const sy = (dy + 0.5) * sh / th - 0.5;
      const x0 = Math.max(0, Math.floor(sx));
      const x1 = Math.min(sw - 1, x0 + 1);
      const y0 = Math.max(0, Math.floor(sy));
      const y1 = Math.min(sh - 1, y0 + 1);
      const fx = sx - x0, fy = sy - y0; // fractional offsets
      // weighted average of 4 neighbouring source pixels
      out[dy*tw + dx] =
        src[y0*sw + x0] * (1-fx) * (1-fy) +
        src[y0*sw + x1] *    fx  * (1-fy) +
        src[y1*sw + x0] * (1-fx) *    fy  +
        src[y1*sw + x1] *    fx  *    fy;
    }
  return out; // Float32Array(tw * th), values 0.0–1.0
}`,

// 6 — Features
`const SZ = 32; // 32×32 output grid

function extractFeatures(px) {
  const rowP = new Float32Array(SZ);
  const colP = new Float32Array(SZ);
  // sum ink along each row and column
  for (let y = 0; y < SZ; y++)
    for (let x = 0; x < SZ; x++) {
      rowP[y] += px[y*SZ + x];
      colP[x] += px[y*SZ + x];
    }
  // normalise to average per cell (0.0–1.0)
  for (let i = 0; i < SZ; i++) {
    rowP[i] /= SZ;
    colP[i] /= SZ;
  }
  // concatenate: [1024 pixels | 32 row sums | 32 col sums]
  const f = new Float32Array(SZ*SZ + SZ + SZ); // 1088 total
  f.set(px,   0);          // pixel grid
  f.set(rowP, SZ*SZ);      // row projections
  f.set(colP, SZ*SZ + SZ); // col projections
  return f;
}`,

// 7 — Classification
`function euclidean(a, b) {
  let s = 0;
  for (let i = 0; i < a.length; i++) {
    const d = a[i] - b[i];
    s += d * d;            // accumulate squared differences
  }
  return Math.sqrt(s);    // √( Σ diff² )
}

function classifyDetailed(px32) {
  const f = extractFeatures(px32);           // 1088-dim input vector
  const minDist = new Float32Array(10).fill(Infinity);
  const bestTmpl = new Array(10).fill(null);

  for (const t of templates) {
    const d = euclidean(f, t.feat);
    if (d < minDist[t.digit]) {              // keep best match per digit
      minDist[t.digit] = d;
      bestTmpl[t.digit] = t;
    }
  }

  // convert distances to confidence: smaller distance = higher confidence
  const eps = 1e-6;
  const raw = Array.from(minDist).map(d => 1 / (d + eps));
  const tot = raw.reduce((a, b) => a + b, 0);
  const conf = raw.map(c => c / tot);        // normalise to sum = 1

  const best = conf.indexOf(Math.max(...conf));
  return { digit: best, conf, minDist, bestTmpl,
           allDist: templates.map(t => ({ ...t, dist: euclidean(f, t.feat) }))
                             .sort((a, b) => a.dist - b.dist) };
}`
];

// ═══════════════════════════════════════════════════════════════════
// 7. STEP DEFINITIONS
// ═══════════════════════════════════════════════════════════════════

// Reusable explanation box
function infoBox(html) {
  const el = document.createElement('div');
  el.style.cssText = 'width:100%;font-size:0.86rem;line-height:1.8;color:#6868a0;background:#0a0a18;border:1px solid #18183a;border-radius:8px;padding:13px 15px';
  el.innerHTML = html;
  return el;
}
function hi(t)  { return `<span style="color:#c084fc;font-weight:600">${t}</span>`; }
function hi2(t) { return `<span style="color:#818cf8;font-weight:600">${t}</span>`; }
function dim(t) { return `<span style="color:#38385a">${t}</span>`; }

// Monospace data-peek panel: peekBox('title', [['label', 'value', '#color'], ...])
function peekBox(title, rows) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:100%;background:#05050f;border:1px solid #111130;border-radius:8px;overflow:hidden';
  const head = document.createElement('div');
  head.style.cssText = 'padding:7px 14px;border-bottom:1px solid #111130;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#33335a;font-family:monospace';
  head.textContent = '// ' + title;
  const body = document.createElement('div');
  body.style.cssText = 'padding:10px 14px;font-family:"Courier New",monospace;font-size:0.76rem;line-height:2;overflow-x:auto';
  rows.forEach(([lbl, val, clr]) => {
    const line = document.createElement('div');
    line.style.cssText = 'display:flex;gap:0;white-space:pre';
    line.innerHTML =
      `<span style="color:#2e2e5a;min-width:165px;display:inline-block">${lbl}</span>` +
      `<span style="color:${clr || '#818cf8'}">${val}</span>`;
    body.appendChild(line);
  });
  wrap.appendChild(head); wrap.appendChild(body);
  return wrap;
}

const STEPS = [
  // ── Step 0: Original ──────────────────────────────────────────
  {
    title: 'Capture — RGBA Pixel Grid',
    desc:  'Before any processing begins the canvas is read pixel-by-pixel into a flat array. Every pixel occupies 4 consecutive slots — Red, Green, Blue (0–255 each) and Alpha (opacity). Drawing in colour makes this concrete: a red stroke stores [R:255, G:20, B:20, A:255]; a blue stroke stores [R:20, G:20, B:255, A:255]; background is always [R:0, G:0, B:0, A:255]. The algorithm reads nothing but these raw numbers — it has no concept of "a digit".',
    render(data, el) {
      const c = document.createElement('canvas');
      c.width = data.w; c.height = data.h;
      c.getContext('2d').putImageData(data.originalImgData, 0, 0);
      el.appendChild(scaledCanvas(c, 224, 224, false));
      el.appendChild(label(I18N[currentLang].steps[0].pixelLabel(data.w, data.h, data.w * data.h)));
      el.appendChild(infoBox(I18N[currentLang].steps[0].info(data)));

      // ── Real data peek: sample 5 consecutive pixels along the center row ──
      const d = data.originalImgData.data;
      const cx = Math.floor(data.w / 2), cy = Math.floor(data.h / 2);
      const peekRows = [];
      for (let px = 0; px < 5; px++) {
        const idx = (cy * data.w + cx + px) * 4;
        const rv = d[idx], gv = d[idx+1], bv = d[idx+2], av = d[idx+3];
        const isInk = rv > 127;
        peekRows.push([
          `pixel[${cy},${cx+px}]`,
          `[R:${String(rv).padStart(3)}, G:${String(gv).padStart(3)}, B:${String(bv).padStart(3)}, A:${String(av).padStart(3)}]  ${isInk ? '← ink' : '← bg'}`,
          isInk ? '#c084fc' : '#38385a'
        ]);
      }
      el.appendChild(peekBox(`imageData.data — 5 pixels from row ${cy}`, peekRows));
    }
  },

  // ── Step 1: Grayscale ─────────────────────────────────────────
  {
    title: 'Grayscale Conversion',
    desc:  "Colour is irrelevant for recognising digit shapes, so we reduce three channels (R, G, B) down to one brightness value. The weights are not equal because human eyes — and cameras calibrated to them — are most sensitive to green light, moderately sensitive to red, and least sensitive to blue. Using these perceptual weights produces a brightness that matches how bright things look to us.",
    render(data, el) {
      el.appendChild(scaledCanvas(grayCanvas(data.gray, data.w, data.h), 224, 224, false));

      const formula = document.createElement('div');
      formula.style.cssText = 'font-family:monospace;font-size:0.75rem;color:#818cf8;text-align:center;background:#0a0a18;padding:8px 12px;border-radius:8px;width:100%';
      formula.textContent = 'gray = 0.299·R  +  0.587·G  +  0.114·B';
      el.appendChild(formula);

      el.appendChild(infoBox(I18N[currentLang].steps[1].info(data)));

      // ── Real data peek: same 5 pixels, now single gray values ──
      const cx = Math.floor(data.w / 2), cy = Math.floor(data.h / 2);
      const peekRows = [];
      for (let px = 0; px < 5; px++) {
        const idx = cy * data.w + cx + px;
        const g = data.gray[idx];
        peekRows.push([
          `gray[${cy * data.w + cx + px}]`,
          g.toFixed(2).padStart(6) + (g > 127 ? '  ← bright (ink)' : '  ← dark (background)'),
          g > 127 ? '#c084fc' : '#38385a'
        ]);
      }
      peekRows.push(['...', `(${(data.w * data.h).toLocaleString()} values total)`, '#252545']);
      el.appendChild(peekBox('gray[] — Float32Array, one value per pixel', peekRows));
    }
  },

  // ── Step 2: Histogram + Otsu ──────────────────────────────────
  {
    title: "Finding the Cut Point — Otsu's Threshold",
    desc:  "After grayscale conversion every pixel is a number 0–255. We need one dividing line T: pixels darker than T will be called background, pixels brighter than T will be called ink. But how do we pick T without guessing? We count how many pixels sit at each brightness level (that count chart is the histogram), then test every possible T from 0 to 255 and measure how cleanly it splits the two groups. The T that produces the cleanest split wins — this is Otsu's method.",
    render(data, el) {
      const W = 320, H = 130;
      const hc = document.createElement('canvas'); hc.width = W; hc.height = H;
      hc.style.borderRadius = '8px';
      const ctx = hc.getContext('2d');
      ctx.fillStyle = '#0a0a18'; ctx.fillRect(0,0,W,H);

      const pad = 6, chartH = H - pad*2 - 14, chartW = W - pad*2;
      let maxV = 0;
      for (let i = 1; i < 255; i++) if (data.histogram[i] > maxV) maxV = data.histogram[i]; // skip 0 & 255 extremes for scale

      const bw = chartW / 256;
      for (let i = 0; i < 256; i++) {
        const bh = Math.min((data.histogram[i] / maxV) * chartH, chartH);
        const x = pad + i * bw, y = pad + chartH - bh;
        ctx.fillStyle = i <= data.threshold ? '#28204a' : '#3a2f60';
        ctx.fillRect(x, y, Math.max(0.5, bw - 0.3), bh);
      }

      // Cluster labels
      const _s2 = I18N[currentLang].steps[2];
      ctx.fillStyle = '#38385a'; ctx.font = '9px sans-serif';
      ctx.fillText(_s2.backgroundLabel, pad + 2, pad + 10);
      ctx.fillText(_s2.inkLabel, pad + (data.threshold + 20) * bw, pad + 10);

      // Threshold line
      const tx = pad + data.threshold * bw;
      ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 1.5;
      ctx.setLineDash([3,2]);
      ctx.beginPath(); ctx.moveTo(tx, pad); ctx.lineTo(tx, pad+chartH); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#c084fc'; ctx.font = 'bold 10px monospace';
      ctx.fillText(`t=${data.threshold}`, Math.min(tx+3, W-42), pad+11);

      // Axis
      ctx.fillStyle = '#2a2a48'; ctx.font = '9px monospace';
      ctx.fillText('0', pad, H-2); ctx.fillText('128', W/2-8, H-2); ctx.fillText('255', W-22, H-2);

      el.appendChild(hc);

      el.appendChild(infoBox(I18N[currentLang].steps[2].info(data)));

      // ── Real data peek: histogram counts around the threshold ──
      const t = data.threshold;
      const peekRows = [];
      for (let i = t - 4; i <= t + 4; i++) {
        if (i < 0 || i > 255) continue;
        const count = data.histogram[i];
        const isT = i === t;
        peekRows.push([
          `hist[${String(i).padStart(3)}]`,
          `${String(Math.round(count)).padStart(7)} pixels` + (isT ? '  ← THRESHOLD (Otsu picked this)' : ''),
          isT ? '#c084fc' : (i < t ? '#38385a' : '#52527a')
        ]);
      }
      el.appendChild(peekBox('histogram[] — pixel count at each brightness level', peekRows));
    }
  },

  // ── Step 3: Binary ────────────────────────────────────────────
  {
    title: 'Binarization',
    desc:  "Every pixel is now exactly 0 (background) or 1 (ink) — no shades of grey. Any pixel whose brightness was above the threshold becomes ink; everything else becomes background. The auto-invert check then counts the total ink pixels: if more than half the canvas is 'ink', it means the image is inverted (e.g. dark digit on light paper), so all values are flipped. After this step the digit is always white on black regardless of how it was drawn.",
    render(data, el) {
      el.appendChild(scaledCanvas(binCanvas(data.binary, data.w, data.h), 224, 224, false));

      el.appendChild(infoBox(I18N[currentLang].steps[3].info(data)));

      // ── Real data peek: show a 6-wide strip crossing an ink edge ──
      // Find the first row that contains ink, then show 6 pixels spanning the edge
      const { w, h, binary, bb } = data;
      const scanRow = bb ? bb.y0 + Math.floor((bb.y1 - bb.y0) / 2) : Math.floor(h / 2);
      const scanStart = bb ? Math.max(0, bb.x0 - 2) : Math.max(0, Math.floor(w/2) - 2);
      const peekRows = [];
      for (let px = 0; px < 8; px++) {
        const x = scanStart + px, idx = scanRow * w + x;
        const v = data.binary[idx];
        peekRows.push([
          `binary[${idx}]`,
          `${v}   ${v ? '█ ink' : '· background'}`,
          v ? '#c084fc' : '#2a2a48'
        ]);
      }
      peekRows.push(['...', `(${(w * h).toLocaleString()} values total, only 0 or 1)`, '#252545']);
      el.appendChild(peekBox(`binary[] — Uint8Array, row ${scanRow} cols ${scanStart}–${scanStart+7}`, peekRows));
    }
  },

  // ── Step 4: Bounding Box ──────────────────────────────────────
  {
    title: 'Bounding Box',
    desc:  "The algorithm scans every row to find the topmost and bottommost ink pixel, and every column to find the leftmost and rightmost. This forms the tightest possible rectangle around the digit. Without this step, the same digit drawn in different corners of the canvas would produce completely different feature vectors — the bounding box eliminates position. Padding (18% of the larger dimension) is added so the digit never touches the edges, which would distort the next resize step.",
    render(data, el) {
      const { binary, w, h, bb } = data;
      const c = binCanvas(binary, w, h);
      const ctx = c.getContext('2d');

      ctx.fillStyle = 'rgba(129,140,248,0.07)';
      ctx.fillRect(bb.x0, bb.y0, bb.x1-bb.x0+1, bb.y1-bb.y0+1);
      ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 1.5;
      ctx.strokeRect(bb.x0+0.5, bb.y0+0.5, bb.x1-bb.x0, bb.y1-bb.y0);

      const tk = 8;
      ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
      [[bb.x0,bb.y0,1,1],[bb.x1,bb.y0,-1,1],[bb.x0,bb.y1,1,-1],[bb.x1,bb.y1,-1,-1]].forEach(([cx,cy,sx,sy])=>{
        ctx.beginPath();
        ctx.moveTo(cx+sx*tk, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy+sy*tk);
        ctx.stroke();
      });

      // Draw dimension labels on canvas
      ctx.fillStyle = '#818cf8'; ctx.font = '10px monospace';
      const bboxW = bb.x1-bb.x0+1, bboxH = bb.y1-bb.y0+1;
      ctx.fillText(`${bboxW}px`, bb.x0 + bboxW/2 - 12, bb.y1 + 14);

      el.appendChild(scaledCanvas(c, 224, 224, false));

      el.appendChild(infoBox(I18N[currentLang].steps[4].info(data)));

      // ── Real data peek: what the four edge-scans found ──
      // Show 5 pixels from the top scan line at the moment it hit first ink
      const topRowStart = bb.y0 * w;
      const leftColHit  = bb.x0;
      const peekRows = [
        ['scan → top',    `scanned rows 0→${h-1}, first ink at row ${bb.y0}`, '#818cf8'],
        ['scan → bottom', `scanned rows ${h-1}→0, last  ink at row ${bb.y1}`, '#818cf8'],
        ['scan → left',   `scanned cols 0→${w-1}, first ink at col ${bb.x0}`, '#c084fc'],
        ['scan → right',  `scanned cols ${w-1}→0, last  ink at col ${bb.x1}`, '#c084fc'],
        ['─────', '─'.repeat(40), '#111130'],
      ];
      // Show the actual pixel sequence that triggered the top boundary
      let seqStr = '';
      for (let x = Math.max(0, leftColHit - 2); x < Math.min(w, leftColHit + 6); x++) {
        seqStr += (binary[topRowStart + x] ? '1' : '0') + ' ';
      }
      peekRows.push([`binary[row ${bb.y0}]`, seqStr.trim() + `  ← first ink row`, '#52527a']);
      el.appendChild(peekBox('bounding box — scan results', peekRows));
    }
  },

  // ── Step 5: Crop & Normalize ──────────────────────────────────
  {
    title: 'Crop → Normalize 32×32',
    desc:  "The cropped image can be any size depending on how big you drew. To compare two drawings they must be the same size. We use 32×32: large enough to preserve the shape of each digit, small enough to keep computation fast. Bilinear interpolation calculates each output pixel as a weighted average of its four nearest neighbours in the source image — smoother than just picking the nearest pixel, but much simpler than a full convolution.",
    render(data, el) {
      const row = document.createElement('div'); row.className = 'viz-row';
      row.style.cssText = 'align-items:center;justify-content:center';

      const cc = normCanvas(data.cropped.data, data.cropped.w, data.cropped.h);
      const maxDim = Math.max(data.cropped.w, data.cropped.h);
      const scale = Math.min(140 / maxDim, 3);
      const cCol = document.createElement('div'); cCol.className = 'viz-col';
      cCol.appendChild(scaledCanvas(cc, data.cropped.w * scale, data.cropped.h * scale, false));
      cCol.appendChild(label(I18N[currentLang].steps[5].croppedLabel(data.cropped.w, data.cropped.h)));

      const arrow = document.createElement('div');
      arrow.style.cssText = 'font-size:1.4rem;color:#4a4a6a;flex-shrink:0';
      arrow.textContent = '→';

      const nc = normCanvas(data.resized, SZ, SZ);
      const nCol = document.createElement('div'); nCol.className = 'viz-col';
      nCol.appendChild(scaledCanvas(nc, 128, 128, true));
      nCol.appendChild(label(I18N[currentLang].steps[5].normalizedLabel));

      row.appendChild(cCol); row.appendChild(arrow); row.appendChild(nCol);
      el.appendChild(row);

      el.appendChild(infoBox(I18N[currentLang].steps[5].info(data)));

      // ── Real data peek: first two rows of the 32×32 array ──
      const peekRows = [];
      for (let row = 0; row < 3; row++) {
        const vals = Array.from(data.resized.slice(row * SZ, row * SZ + SZ))
          .map(v => v.toFixed(2)).join('  ');
        peekRows.push([`resized[row ${row}]`, vals, row === 0 ? '#818cf8' : '#52527a']);
      }
      peekRows.push(['...', `(${SZ} rows × ${SZ} cols = ${SZ*SZ} values total)`, '#252545']);
      el.appendChild(peekBox('resized[] — Float32Array 32×32, values 0.00–1.00', peekRows));
    }
  },

  // ── Step 6: Feature Map ───────────────────────────────────────
  {
    title: 'Feature Extraction',
    desc:  "Raw pixels alone can be fooled by tiny shifts — a '1' moved one pixel left becomes a completely different vector. Projection histograms add a more global 'fingerprint': the row projection tells you how much ink is in each horizontal slice of the image; the column projection tells you how much ink is in each vertical slice. Together they describe the overall shape independent of small translations. A '1' has one dense column; a '0' has dense edges and an empty centre; a '7' has a heavy top row.",
    render(data, el) {
      const { resized, rowProj, colProj } = data;

      const imgC = normCanvas(resized, SZ, SZ);
      scaledCanvas(imgC, 160, 160, true);

      // Row projection — bars to the right of the image
      const RC = 64, RH = 160, barH = Math.floor(RH/SZ) - 1;
      const rc = document.createElement('canvas'); rc.width = RC; rc.height = RH;
      rc.style.borderRadius = '6px';
      const rctx = rc.getContext('2d');
      rctx.fillStyle = '#0a0a18'; rctx.fillRect(0,0,RC,RH);
      for (let y = 0; y < SZ; y++) {
        const bw = Math.round(rowProj[y] * (RC-4));
        rctx.fillStyle = rowProj[y] > 0.3 ? '#818cf8' : '#2a2a50';
        rctx.fillRect(2, y*(barH+1), Math.max(1, bw), barH);
      }

      // Col projection — bars below the image
      const CW = 160, CH = 56, barW2 = Math.floor(CW/SZ) - 1;
      const cc2 = document.createElement('canvas'); cc2.width = CW; cc2.height = CH;
      cc2.style.borderRadius = '6px';
      const cctx = cc2.getContext('2d');
      cctx.fillStyle = '#0a0a18'; cctx.fillRect(0,0,CW,CH);
      for (let x = 0; x < SZ; x++) {
        const bh = Math.round(colProj[x] * (CH-4));
        cctx.fillStyle = colProj[x] > 0.3 ? '#c084fc' : '#2a1a40';
        cctx.fillRect(x*(barW2+1), CH-2-bh, barW2, Math.max(1, bh));
      }

      const topRow = document.createElement('div'); topRow.className = 'viz-row';
      topRow.style.alignItems = 'flex-start';
      const imgCol = document.createElement('div'); imgCol.className = 'viz-col';
      imgCol.appendChild(imgC);
      imgCol.appendChild(label(I18N[currentLang].steps[6].pixelGridLabel));
      const rowCol = document.createElement('div'); rowCol.className = 'viz-col';
      rowCol.appendChild(rc);
      rowCol.appendChild(label(I18N[currentLang].steps[6].rowSumsLabel));
      topRow.appendChild(imgCol); topRow.appendChild(rowCol);
      el.appendChild(topRow);

      const botCol = document.createElement('div'); botCol.className = 'viz-col';
      botCol.appendChild(cc2);
      botCol.appendChild(label(I18N[currentLang].steps[6].colSumsLabel));
      el.appendChild(botCol);

      // Most active row and column
      const maxRow = rowProj.indexOf(Math.max(...rowProj));
      const maxCol = colProj.indexOf(Math.max(...colProj));

      el.appendChild(infoBox(I18N[currentLang].steps[6].info(data)));

      // ── Real data peek: slices from each section of the feature vector ──
      const pxSlice  = Array.from(resized.slice(0, 8)).map(v => v.toFixed(2)).join('  ');
      const rowSlice = rowProj.slice(0, 8).map(v => v.toFixed(2)).join('  ');
      const colSlice = colProj.slice(0, 8).map(v => v.toFixed(2)).join('  ');
      el.appendChild(peekBox('features[] — Float32Array(1088), first 8 values of each section', [
        ['features[0..7]',    pxSlice  + '  …', '#818cf8'],
        ['  (pixel grid,',    '1024 values — each is one cell of the 32×32 image)',  '#252545'],
        ['features[1024..1031]', rowSlice + '  …', '#c084fc'],
        ['  (row projection,','32 values — average ink density per row)',             '#252545'],
        ['features[1056..1063]', colSlice + '  …', '#c084fc'],
        ['  (col projection,','32 values — average ink density per column)',          '#252545'],
      ]));
    }
  },

  // ── Step 7: Template Matching + Result ────────────────────────
  {
    title: 'Classification & Result',
    desc:  'Your 1088 feature values are compared to every stored template. Distance measures how different two vectors are — lower distance means more similar. The winning digit is whichever has the smallest distance to your drawing.',
    render(data, el) {
      const { result } = data;

      // ── 1. Your drawing vs best match ──────────────────────────
      const cmpRow = document.createElement('div');
      cmpRow.className = 'viz-row';
      cmpRow.style.cssText = 'justify-content:center;align-items:center;gap:12px;width:100%';

      const makeImgCol = (pixels, capText, subText) => {
        const col = document.createElement('div'); col.className = 'viz-col';
        const c = normCanvas(pixels, SZ, SZ);
        scaledCanvas(c, 80, 80, true);
        col.appendChild(c);
        col.appendChild(label(capText));
        if (subText) {
          const s = document.createElement('div');
          s.style.cssText = 'font-size:0.68rem;color:#818cf8;text-align:center';
          s.textContent = subText;
          col.appendChild(s);
        }
        return col;
      };

      const best = result.allDist[0];
      const arrow = document.createElement('div');
      arrow.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0';
      arrow.innerHTML =
        `<span style="font-size:0.62rem;color:#38385a">vs</span>` +
        `<span style="font-size:1.1rem;color:#38385a">↔</span>` +
        `<span style="font-size:0.65rem;color:#818cf8;white-space:nowrap">d = ${best.dist.toFixed(2)}</span>`;

      const _s7 = I18N[currentLang].steps[7];
      cmpRow.appendChild(makeImgCol(data.resized, _s7.yourDrawing, null));
      cmpRow.appendChild(arrow);
      cmpRow.appendChild(makeImgCol(best.pixels, _s7.templateLabel(best.digit), `(${best.font})`));
      el.appendChild(cmpRow);

      // ── 2. What "distance" means ────────────────────────────────
      const explain = document.createElement('div');
      explain.style.cssText = 'width:100%;font-size:0.86rem;line-height:1.8;color:#6868a0;background:#0a0a18;border-radius:8px;padding:13px 15px';
      explain.innerHTML = _s7.explainHtml;
      el.appendChild(explain);

      // ── 3. Per-digit: best distance → confidence ────────────────
      const tableTitle = document.createElement('div');
      tableTitle.style.cssText = 'font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#44446a;width:100%;margin-top:4px';
      tableTitle.textContent = _s7.tableTitleText;
      el.appendChild(tableTitle);

      const confBlock = document.createElement('div'); confBlock.style.width = '100%';
      result.conf.forEach((c, i) => {
        const isWinner = i === result.digit;
        const pct  = (c * 100).toFixed(1);
        const dist = result.minDist[i] === Infinity ? '—' : result.minDist[i].toFixed(2);
        const r = document.createElement('div');
        r.style.cssText = 'display:flex;align-items:center;gap:5px;margin-bottom:5px';
        r.innerHTML =
          `<span style="width:14px;font-size:0.88rem;font-weight:${isWinner?'800':'400'};color:${isWinner?'#e2e2f0':'#4a4a6a'}">${i}</span>` +
          `<span style="width:46px;font-size:0.75rem;color:#44446a;text-align:right;flex-shrink:0">d=${dist}</span>` +
          `<div style="flex:1;height:14px;background:#0d0d1a;border-radius:3px;overflow:hidden">` +
            `<div style="height:100%;width:${pct}%;border-radius:3px;background:${isWinner?'linear-gradient(90deg,#818cf8,#c084fc)':'#22223a'};transition:width 0.3s"></div>` +
          `</div>` +
          `<span style="width:42px;font-size:0.78rem;color:${isWinner?'#818cf8':'#44446a'};text-align:right">${pct}%</span>`;
        confBlock.appendChild(r);
      });
      el.appendChild(confBlock);

      // ── Real data peek: show first 5 terms of the distance formula for best match ──
      const bestTmpl = result.allDist[0];
      const inputFeat2 = extractFeatures(data.resized);
      const peekRowsD = [];
      let sumSq = 0;
      for (let i = 0; i < 5; i++) {
        const a = inputFeat2[i], b = bestTmpl.feat[i];
        const diff = a - b, sq = diff * diff;
        sumSq += sq;
        peekRowsD.push([
          `  [${i}]`,
          `your=${a.toFixed(3)}  tmpl=${b.toFixed(3)}  diff=${diff.toFixed(3)}  diff²=${sq.toFixed(4)}`,
          Math.abs(diff) > 0.2 ? '#c084fc' : '#52527a'
        ]);
      }
      // compute full distance
      let totalSq = 0;
      for (let i = 0; i < inputFeat2.length; i++) {
        const d2 = inputFeat2[i] - bestTmpl.feat[i];
        totalSq += d2 * d2;
      }
      peekRowsD.push(['  [5..1087]', `... (${inputFeat2.length - 5} more terms)`, '#252545']);
      peekRowsD.push(['─────', '─'.repeat(44), '#111130']);
      peekRowsD.push(['  Σ(diff²)', totalSq.toFixed(4), '#818cf8']);
      peekRowsD.push(['  √(Σ diff²)', `= ${Math.sqrt(totalSq).toFixed(4)}  ← distance to "${bestTmpl.digit}"`, '#c084fc']);
      el.appendChild(peekBox(
        `distance formula — your drawing vs template "${bestTmpl.digit}" (${bestTmpl.font})`,
        peekRowsD
      ));

      // ── 4. Final answer ─────────────────────────────────────────
      const answerRow = document.createElement('div');
      answerRow.style.cssText = 'display:flex;align-items:center;gap:14px;width:100%;padding-top:10px;border-top:1px solid #1e1e3a';
      const bigDigit = document.createElement('div'); bigDigit.className = 'result-big-digit';
      bigDigit.textContent = result.digit;
      const answerText = document.createElement('div');
      answerText.style.cssText = 'font-size:0.8rem;line-height:1.7;color:#52527a';
      answerText.innerHTML = _s7.predictedHtml(
        result.digit,
        (result.conf[result.digit]*100).toFixed(1),
        result.minDist[result.digit].toFixed(2)
      );
      answerRow.appendChild(bigDigit);
      answerRow.appendChild(answerText);
      el.appendChild(answerRow);
    }
  },
];

// ═══════════════════════════════════════════════════════════════════
// 8. UI — STEP VIEWER
// ═══════════════════════════════════════════════════════════════════

const stepViewer  = document.getElementById('step-viewer');
const stepDotsEl  = document.getElementById('step-dots');
const stepCounter = document.getElementById('step-counter');
const stepBadge   = document.getElementById('step-badge');
const stepTitle   = document.getElementById('step-title');
const stepDesc    = document.getElementById('step-desc');
const stepViz     = document.getElementById('step-viz');
const prevBtn     = document.getElementById('prev-btn');
const nextBtn     = document.getElementById('next-btn');
const playBtn     = document.getElementById('play-btn');

let currentStep = 0;
let stepData    = null;
let playTimer   = null;
let dots        = [];

function buildDots() {
  stepDotsEl.innerHTML = '';
  dots = STEPS.map((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = I18N[currentLang].steps[i].title;
    d.addEventListener('click', () => goToStep(i));
    stepDotsEl.appendChild(d);
    return d;
  });
}

function goToStep(i) {
  if (!stepData) return;
  currentStep = Math.max(0, Math.min(STEPS.length-1, i));

  stepViz.classList.add('fading');
  setTimeout(() => {
    renderStep(currentStep);
    stepViz.classList.remove('fading');
  }, 120);

  updateNav();
}

function renderStep(i) {
  const L = I18N[currentLang];
  stepViz.innerHTML = '';
  stepBadge.textContent   = i + 1;
  stepTitle.textContent   = L.steps[i].title;
  stepDesc.textContent    = L.steps[i].desc;
  stepCounter.textContent = `${i+1} / ${STEPS.length}`;
  STEPS[i].render(stepData, stepViz);
  stepViz.appendChild(buildDataExpand(stepData, i));
  if (STEP_CODE[i]) stepViz.appendChild(codeExpand(L.codeTitle, STEP_CODE[i]));
}

function updateNav() {
  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep === STEPS.length - 1;
  dots.forEach((d, i) => {
    d.classList.toggle('active', i === currentStep);
    d.classList.toggle('done',   i < currentStep);
  });
  dots[currentStep]?.classList.remove('done');
}

prevBtn.addEventListener('click', () => { stopPlay(); goToStep(currentStep-1); });
nextBtn.addEventListener('click', () => { stopPlay(); goToStep(currentStep+1); });

function stopPlay() {
  clearInterval(playTimer); playTimer = null;
  playBtn.textContent = '▶';
}

playBtn.addEventListener('click', () => {
  if (playTimer) { stopPlay(); return; }
  if (currentStep === STEPS.length-1) goToStep(0);
  playBtn.textContent = '⏸';
  playTimer = setInterval(() => {
    if (currentStep < STEPS.length-1) {
      goToStep(currentStep+1);
    } else {
      stopPlay();
    }
  }, 1400);
});

// ═══════════════════════════════════════════════════════════════════
// 9. UI — DRAWING CANVAS
// ═══════════════════════════════════════════════════════════════════

const drawCanvas = document.getElementById('draw-canvas');
const drawCtx    = drawCanvas.getContext('2d');

function resetCanvas() {
  drawCtx.fillStyle = '#000';
  drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
}

function getXY(e) {
  const r = drawCanvas.getBoundingClientRect();
  const scX = drawCanvas.width / r.width, scY = drawCanvas.height / r.height;
  const src = e.touches ? e.touches[0] : e;
  return [(src.clientX - r.left)*scX, (src.clientY - r.top)*scY];
}

let painting = false, lx = 0, ly = 0;
let hue = Math.floor(Math.random() * 360); // rainbow brush — cycles through colours as you draw

function strokeColor() { return `hsl(${hue}, 100%, 62%)`; }

function startDraw(e) {
  e.preventDefault(); painting = true;
  [lx, ly] = getXY(e);
  drawCtx.beginPath();
  drawCtx.arc(lx, ly, 10, 0, Math.PI*2);
  drawCtx.fillStyle = strokeColor(); drawCtx.fill();
}

function moveDraw(e) {
  if (!painting) return; e.preventDefault();
  const [x, y] = getXY(e);
  drawCtx.beginPath(); drawCtx.moveTo(lx, ly); drawCtx.lineTo(x, y);
  drawCtx.strokeStyle = strokeColor(); drawCtx.lineWidth = 20;
  drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; drawCtx.stroke();
  hue = (hue + 1.5) % 360;
  [lx, ly] = [x, y];
}

function endDraw() { painting = false; }

drawCanvas.addEventListener('mousedown',  startDraw);
drawCanvas.addEventListener('mousemove',  moveDraw);
drawCanvas.addEventListener('mouseup',    endDraw);
drawCanvas.addEventListener('mouseleave', endDraw);
drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
drawCanvas.addEventListener('touchmove',  moveDraw,  { passive: false });
drawCanvas.addEventListener('touchend',   endDraw);

// ═══════════════════════════════════════════════════════════════════
// 10. BUTTONS & INIT
// ═══════════════════════════════════════════════════════════════════

document.getElementById('clear-btn').addEventListener('click', () => {
  stopPlay();
  resetCanvas();
  hue = Math.floor(Math.random() * 360);
  stepViewer.style.display = 'none';
  stepData = null;
});

document.getElementById('run-btn').addEventListener('click', () => {
  stopPlay();
  const imgData = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
  const data = computeSteps(imgData);
  if (!data) {
    alert('Draw something first!');
    return;
  }
  stepData = data;
  buildDots();
  currentStep = 0;
  stepViewer.style.display = 'flex';
  renderStep(0);
  updateNav();
});

const templates = buildTemplates();
resetCanvas();
</script>
